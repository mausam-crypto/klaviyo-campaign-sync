databases:
  - name: klaviyo-campaign-sync-db
    plan: basic-256mb
    postgresMajorVersion: "16"

services:
  - type: cron
    name: klaviyo-campaign-sync
    runtime: node
    plan: starter
    schedule: "*/5 * * * *"
    buildCommand: npm install
    startCommand: npm run run
    envVars:
      - key: KLAVIYO_API_KEY
        sync: false
      - key: KLAVIYO_API_REVISION
        value: "2026-07-15"
      - key: SLACK_WEBHOOK_URL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: klaviyo-campaign-sync-db
          property: connectionString
      - key: AUTOMATION_ENABLED
        value: "false"
      - key: DRY_RUN
        value: "true"
